name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    # Pinned, not ubuntu-latest: the E_EVIDENCE_PIPE rule's reason for refusing
    # `set -o pipefail` is this image's dash /bin/sh. Re-check it before moving.
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated output
        run: npm run check-sync

      - name: Prepare test scratch directory
        run: mkdir -p .build

      - name: Run tests
        run: npm test
